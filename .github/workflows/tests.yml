name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run OOP AI admin and storage tests
        run: python -m unittest -v test_ai_manager test_oop test_admin_features test_data_manager_storage test_docker_persistence
      - name: Run complete offline pipeline
        run: python test_pipeline.py
      - name: Run input validation checks
        run: python test_input_validation.py
