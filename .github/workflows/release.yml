name: Release Docker image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t g4-condo-fault-report:local .

      - name: Run unit tests
        run: |
          docker run --rm g4-condo-fault-report:local \
            python -m unittest -v \
            test_ai_manager test_oop test_admin_features \
            test_data_manager_storage test_docker_persistence

      - name: Run pipeline tests
        run: |
          docker run --rm g4-condo-fault-report:local \
            python test_pipeline.py

      - name: Run input validation tests
        run: |
          docker run --rm g4-condo-fault-report:local \
            python test_input_validation.py

      - name: Export Docker image
        run: |
          docker save -o g4-condo-fault-report.tar \
            g4-condo-fault-report:local

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            g4-condo-fault-report.tar \
            --verify-tag \
            --title "Condo Fault Report System $RELEASE_TAG" \
            --notes "Docker image built and tested automatically. Download the tar file and follow README.md to run the app."